name: Bug report
description: Report a reproducible defect using synthetic data.
title: "[Bug]: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include prerequisites and a minimal synthetic example.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Revision and environment
      description: Commit, OS, device/target and relevant versions.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and related requirement/test ID
      description: Never include credentials or personal records.
